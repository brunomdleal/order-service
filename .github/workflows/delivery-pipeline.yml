name: delivery-pipeline.yml
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  VERSION_PREFIX: 0.0.
  ACTOR: ${{ github.actor }}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    name: Build and verify
    steps:
      - name: Clone project
        id: clone_project
        uses: actions/checkout@v7
      - name: Configure JDK 21 & Maven cache
        id: jdk_21_maven_cache
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make wrapper executable
        id: mvn_wrapper
        run: chmod +x ./mvnw
      - name: Run Maven verify
        id: mvn_packager
        run: ./mvnw clean verify
      - name: Build docker images
        id: build_docker_images
        run: docker build \
          -t order-service:$VERSION_PREFIX${{ github.run_number }} \
          -t ghcr.io/${ACTOR,,}/order-service:$VERSION_PREFIX${{ github.run_number }} \
          .
